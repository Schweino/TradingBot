[pytest]
addopts = -p no:cacheprovider
cache_dir = runtime/pytest_cache
testpaths =
    tests
    test_alpaca_trading.py
    test_elite_safety.py
    test_engine_validation.py
norecursedirs =
    .git
    .test_tmp
    .test_work
    archive
    data_cache
    logs
    okay_to_delete
    postmort
    postmortem
    repair_snapshots
    runtime
    tick_logs
    tmp*
    __pycache__
